<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasbulk API — Test</title>
<style>
:root{
  --bg:#0D1B2A;--surf:#142236;--card:#1A2E44;
  --bdr:rgba(255,255,255,0.08);--txt:#D8EAF8;--txt2:#7096B8;--txt3:#3D6080;
  --blue:#1E90FF;--blue-bg:rgba(30,144,255,0.13);--blue-bdr:rgba(30,144,255,0.35);
  --green:#22C55E;--green-bg:rgba(34,197,94,0.13);
  --amber:#F59E0B;--amber-bg:rgba(245,158,11,0.13);
  --red:#EF4444;--red-bg:rgba(239,68,68,0.13);
  --gray-bg:rgba(100,116,139,0.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;min-height:100vh}

.hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo em{color:var(--blue);font-style:normal}
.badge{background:var(--amber-bg);color:var(--amber);border-radius:5px;font-size:11px;font-weight:700;padding:2px 8px}

.body{max-width:900px;margin:0 auto;padding:20px 16px}

/* control bar */
.ctrl{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.ctrl label{font-size:12px;color:var(--txt2);margin-bottom:4px;display:block;letter-spacing:.4px;text-transform:uppercase}
input[type=date]{background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-family:inherit;font-size:14px;padding:8px 12px;outline:none}
input[type=date]:focus{border-color:var(--blue)}
input[type=text]{background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;padding:8px 12px;outline:none;min-width:240px}
input[type=text]:focus{border-color:var(--blue)}

.btn{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:9px 20px;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{background:var(--card);border:1px solid var(--bdr);color:var(--txt2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

/* endpoint tabs */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--txt2);cursor:pointer;font-family:inherit;font-size:13px;padding:6px 14px;transition:all .15s}
.tab.on{background:var(--blue-bg);border-color:var(--blue-bdr);color:var(--blue);font-weight:700}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.sn{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.sl{font-size:11px;color:var(--txt3);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.sn.t{color:var(--txt)}
.sn.a{color:var(--green)}
.sn.r{color:var(--amber)}
.sn.l{color:var(--red)}

/* cards */
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;position:relative}
.stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.s-early{background:var(--green)} .s-ontime{background:var(--blue)}
.s-transit{background:var(--amber)} .s-late{background:var(--red)}
.s-pending{background:var(--txt3)} .s-arrived{background:var(--green)}
.cbody{padding:10px 12px 10px 18px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.cname{font-size:17px;font-weight:800;letter-spacing:-.5px}
.badge2{border-radius:20px;font-size:11px;font-weight:700;padding:3px 9px;white-space:nowrap}
.b-early{background:var(--green-bg);color:var(--green)}
.b-ontime{background:var(--blue-bg);color:var(--blue)}
.b-transit{background:var(--amber-bg);color:var(--amber)}
.b-late{background:var(--red-bg);color:var(--red)}
.b-pending{background:var(--gray-bg);color:var(--txt3)}
.b-arrived{background:var(--green-bg);color:var(--green)}
.cmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt2)}
.cmeta span{white-space:nowrap}
.cmeta strong{color:var(--txt)}
.predict{margin-top:6px;font-size:13px;font-weight:600}
.predict.late{color:var(--red)} .predict.early{color:var(--green)}
.predict.ok{color:var(--blue)} .predict.gray{color:var(--txt3)}

/* raw json */
.raw{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px;font-family:'Courier New',monospace;font-size:12px;color:var(--txt2);overflow:auto;max-height:500px;white-space:pre;margin-top:8px;display:none}
.raw.show{display:block}

/* status */
.status-bar{padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.status-ok{background:var(--green-bg);color:var(--green)}
.status-err{background:var(--red-bg);color:var(--red)}
.status-load{background:var(--blue-bg);color:var(--blue)}

/* health */
.health-box{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:16px;font-size:14px}
.health-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr)}
.health-row:last-child{border:none}
.health-row .k{color:var(--txt2)}
.health-row .v{font-weight:600;font-family:monospace}

.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">Gasbulk<em>Track</em></div>
  <span class="badge">TEST MODE</span>
  <span style="font-size:12px;color:var(--txt3);margin-left:auto">localhost:8000</span>
</div>

<div class="body">

  <!-- CONTROL -->
  <div class="ctrl">
    <div>
      <label>Base URL</label>
      <input type="text" id="baseUrl" value="http://localhost:8000">
    </div>
    <div>
      <label>วันที่</label>
      <input type="date" id="dateInput">
    </div>
    <button class="btn btn-primary" id="testBtn" onclick="testTrips()">▶ ทดสอบ /api/trips</button>
    <button class="btn btn-ghost" onclick="testHealth()">♥ Health Check</button>
    <button class="btn btn-ghost" onclick="toggleRaw()">{ } JSON</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab on" id="tabTrips" onclick="switchTab('trips')">📋 ทริปประจำวัน</button>
    <button class="tab" id="tabHealth" onclick="switchTab('health')">💚 Health</button>
  </div>

  <!-- STATUS -->
  <div id="statusBar" style="display:none"></div>

  <!-- TRIPS PANEL -->
  <div id="panelTrips">
    <div class="stats" id="stats" style="display:none">
      <div class="stat"><div class="sn t" id="sTotal">—</div><div class="sl">ทั้งหมด</div></div>
      <div class="stat"><div class="sn a" id="sArr">—</div><div class="sl">ถึงแล้ว</div></div>
      <div class="stat"><div class="sn r" id="sTrn">—</div><div class="sl">กำลังเดิน</div></div>
      <div class="stat"><div class="sn l" id="sLate">—</div><div class="sl">ช้า</div></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="raw" id="rawJson"></div>
  </div>

  <!-- HEALTH PANEL -->
  <div id="panelHealth" style="display:none">
    <div class="health-box" id="healthBox"><div class="empty">กด Health Check ด้านบน</div></div>
  </div>

</div>

<script>
var showRaw = false;
var currentTab = 'trips';
var lastData = null;

// ตั้งวันที่เป็นวันนี้
(function(){
  var d = new Date();
  document.getElementById('dateInput').value = d.toISOString().split('T')[0];
})();

function base(){ return document.getElementById('baseUrl').value.replace(/\/$/,''); }

function setStatus(msg, type){
  var el = document.getElementById('statusBar');
  el.style.display = 'block';
  el.className = 'status-bar status-' + type;
  el.innerHTML = msg;
}

function switchTab(t){
  currentTab = t;
  document.getElementById('tabTrips').className  = 'tab' + (t==='trips'?' on':'');
  document.getElementById('tabHealth').className = 'tab' + (t==='health'?' on':'');
  document.getElementById('panelTrips').style.display  = t==='trips'?'':'none';
  document.getElementById('panelHealth').style.display = t==='health'?'':'none';
}

function toggleRaw(){
  showRaw = !showRaw;
  document.getElementById('rawJson').className = 'raw' + (showRaw?' show':'');
}

var LABELS = {early:'ถึงเร็ว',ontime:'ตรงเวลา',late:'ช้ากว่ากำหนด',transit:'กำลังเดิน',pending:'รอออกรถ',arrived:'จัดส่งแล้ว'};

async function testTrips(){
  var btn = document.getElementById('testBtn');
  btn.innerHTML = '<span class="spin">↻</span> กำลังดึง...';
  btn.disabled = true;
  setStatus('<span class="spin">↻</span> กำลังเชื่อมต่อ ' + base() + ' ...', 'load');

  var date = document.getElementById('dateInput').value;
  var url  = base() + '/api/trips?date=' + date;

  try {
    var r    = await fetch(url);
    var data = await r.json();
    lastData = data;

    if(!r.ok){ throw new Error(data.detail || r.statusText); }

    setStatus('✓ ดึงข้อมูลสำเร็จ — ' + data.total + ' ทริป | ' + data.fetched_at, 'ok');

    // stats
    var st = document.getElementById('stats');
    st.style.display = 'grid';
    document.getElementById('sTotal').textContent = data.total;
    document.getElementById('sArr').textContent   = data.arrived;
    document.getElementById('sTrn').textContent   = data.in_transit;
    document.getElementById('sLate').textContent  = data.late;

    // cards
    var html = '';
    if(!data.trips.length){ html = '<div class="empty">ไม่พบทริปของวันนี้</div>'; }
    data.trips.forEach(function(t){
      var pClass = t.status==='late'?'late':t.status==='early'?'early':t.status==='transit'||t.status==='ontime'?'ok':'gray';
      html += '<div class="card">'
        + '<div class="stripe s-'+t.status+'"></div>'
        + '<div class="cbody">'
        + '<div class="crow">'
        + '<div class="cname">รถ '+t.car_no+'<span style="font-size:12px;font-weight:400;color:var(--txt3);margin-left:6px;font-family:monospace">'+t.plate+'</span></div>'
        + '<span class="badge2 b-'+t.status+'">'+(LABELS[t.status]||t.status)+'</span>'
        + '</div>'
        + '<div class="cmeta">'
        + '<span>📍 <strong>'+t.customer+'</strong></span>'
        + '<span>🕐 กำหนด <strong>'+t.sched_time+'</strong></span>'
        + (t.eta_time?'<span>⏱ ETA <strong>'+t.eta_time+'</strong></span>':'')
        + (t.travel_mins!==null&&t.travel_mins!==undefined?'<span>🛣 อีก <strong>'+t.travel_mins+' นาที</strong></span>':'')
        + (t.current_loc?'<span>📌 '+t.current_loc+'</span>':'')
        + '</div>'
        + (t.prediction?'<div class="predict '+pClass+'">'+t.prediction+'</div>':'')
        + '</div></div>';
    });
    document.getElementById('cards').innerHTML = html;

    // raw
    document.getElementById('rawJson').textContent = JSON.stringify(data, null, 2);

  } catch(e){
    setStatus('✗ Error: ' + e.message + '<br><small style="opacity:.7">ตรวจสอบว่า uvicorn รันอยู่ และ URL ถูกต้อง</small>', 'err');
    document.getElementById('cards').innerHTML = '<div class="empty">ไม่สามารถเชื่อมต่อ API ได้</div>';
  }

  btn.innerHTML = '▶ ทดสอบ /api/trips';
  btn.disabled = false;
}

async function testHealth(){
  switchTab('health');
  setStatus('<span class="spin">↻</span> เรียก /api/health ...', 'load');
  try {
    var r    = await fetch(base() + '/api/health');
    var data = await r.json();
    setStatus('✓ Server ทำงานปกติ', 'ok');
    document.getElementById('healthBox').innerHTML =
      '<div class="health-row"><span class="k">Status</span><span class="v" style="color:var(--green)">'+data.status+'</span></div>'
     +'<div class="health-row"><span class="k">เวลาเซิร์ฟเวอร์ (ไทย)</span><span class="v">'+data.time_thai+'</span></div>'
     +'<div class="health-row"><span class="k">Sheet cache</span><span class="v">'+(data.sheet_cache_keys||[]).join(', ')||'ว่าง'+'</span></div>'
     +'<div class="health-row"><span class="k">ETA cache</span><span class="v">'+(data.eta_cache_size||0)+' entries</span></div>'
     +'<div class="health-row"><span class="k">Endpoint</span><span class="v">'+base()+'/api/health</span></div>';
  } catch(e){
    setStatus('✗ เชื่อมต่อไม่ได้: ' + e.message, 'err');
    document.getElementById('healthBox').innerHTML = '<div class="empty" style="color:var(--red)">Server ไม่ตอบสนอง<br><br>ตรวจสอบว่ารัน uvicorn อยู่ไหม</div>';
  }
}
</script>
</body>
</html>
